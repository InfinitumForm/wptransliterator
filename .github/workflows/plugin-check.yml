name: WordPress Plugin Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare plugin build
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="${RUNNER_TEMP}/serbian-transliteration"

          mkdir -p "${BUILD_DIR}"

          git archive --format=tar HEAD | tar \
            --extract \
            --directory="${BUILD_DIR}" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='.distignore' \
            --exclude='.editorconfig' \
            --exclude='.htaccess' \
            --exclude='CODE_OF_CONDUCT.md' \
            --exclude='CONTRIBUTING.md' \
            --exclude='ISSUE_TEMPLATE.md' \
            --exclude='PULL_REQUEST_TEMPLATE.md' \
            --exclude='README.md' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='phpcs.xml' \
            --exclude='phpcs.xml.dist' \
            --exclude='phpunit.xml' \
            --exclude='phpunit.xml.dist' \
            --exclude='tests'

          test -f "${BUILD_DIR}/serbian-transliteration.php"

          echo "Plugin build:"
          find "${BUILD_DIR}" -type f | sort

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: '${{ runner.temp }}/serbian-transliteration'
          slug: 'serbian-transliteration'
          ignore-warnings: true
          include-experimental: false
