name: WordPress Coding Standards

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - name: Install WordPress Coding Standards
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/phpcs"
          cd "${RUNNER_TEMP}/phpcs"

          composer init --no-interaction --name=ci/phpcs

          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

          composer require \
            --dev \
            --no-interaction \
            --no-progress \
            wp-coding-standards/wpcs:"^3.0"

          "${RUNNER_TEMP}/phpcs/vendor/bin/phpcs" -i

      - name: Find changed PHP files
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"

            if [[ "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 "${HEAD_SHA}")"
            fi
          else
            BASE_SHA="$(git rev-parse HEAD^)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi

          echo "Base: ${BASE_SHA}"
          echo "Head: ${HEAD_SHA}"

          mapfile -t PHP_FILES < <(
            git diff \
              --diff-filter=ACMR \
              --name-only \
              "${BASE_SHA}" \
              "${HEAD_SHA}" \
              -- '*.php'
          )

          EXISTING_FILES=()

          for file in "${PHP_FILES[@]}"; do
            if [[ -f "${file}" ]]; then
              EXISTING_FILES+=("${file}")
            fi
          done

          if [[ ${#EXISTING_FILES[@]} -eq 0 ]]; then
            echo "No changed PHP files found."
            echo "has_files=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          printf '%s\n' "${EXISTING_FILES[@]}"

          {
            echo "has_files=true"
            echo "files<<EOF"
            printf '%s\n' "${EXISTING_FILES[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Run WordPress Coding Standards
        if: steps.changed-files.outputs.has_files == 'true'
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          set -euo pipefail

          mapfile -t FILES <<< "${CHANGED_FILES}"

          "${RUNNER_TEMP}/phpcs/vendor/bin/phpcs" \
            --standard=WordPress \
            --extensions=php \
            --warning-severity=0 \
            --report=full \
            -p \
            "${FILES[@]}"

      - name: No PHP changes
        if: steps.changed-files.outputs.has_files != 'true'
        run: echo "No changed PHP files to check."
